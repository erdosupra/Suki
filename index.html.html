.suki-root{
  --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#EFEDE7;
  --ink:#17181A; --ink-2:#4A4C48; --muted:#8C8E87;
  --line:rgba(23,24,26,0.09); --line-2:rgba(23,24,26,0.055);
  --accent:#5C6B4E; --accent-ink:#3F4A35; --accent-soft:#E6EADF;
  --warn:#9A6B3F; --warn-soft:#F1E6D9;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; color:var(--ink);
  background:var(--bg);
}
.suki-root *{box-sizing:border-box;}
.suki-root button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;}
.suki-root input,.suki-root textarea{font-family:inherit;color:inherit;}
.suki-root :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}

.stage{min-height:100vh;background:#E7E4DD;display:flex;justify-content:center;align-items:stretch;}
.phone{width:100%;max-width:430px;background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column;min-height:100vh;}
@media(min-width:640px){
  .stage{padding:28px 0;align-items:center;}
  .phone{border-radius:44px;min-height:0;height:min(900px,calc(100vh - 56px));
    box-shadow:0 30px 80px rgba(23,24,26,.22);border:1px solid rgba(0,0,0,.08);}
}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 132px;}
.scroll.flush{padding-left:0;padding-right:0;}

/* type */
.h-xl{font-size:34px;line-height:1.06;letter-spacing:-.032em;font-weight:640;}
.h-lg{font-size:26px;line-height:1.12;letter-spacing:-.028em;font-weight:640;}
.h-md{font-size:19px;line-height:1.2;letter-spacing:-.02em;font-weight:620;}
.h-sm{font-size:15.5px;line-height:1.25;letter-spacing:-.012em;font-weight:600;}
.body{font-size:14.5px;line-height:1.5;color:var(--ink-2);letter-spacing:-.006em;}
.sub{font-size:13px;line-height:1.45;color:var(--muted);letter-spacing:-.004em;}
.eyebrow{font-size:11px;font-weight:640;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em;}
.dim{color:var(--muted);}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px;}
.card.tight{padding:14px;border-radius:var(--r-md);}
.row{display:flex;align-items:center;gap:12px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.stack{display:flex;flex-direction:column;}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g28{gap:28px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt20{margin-top:20px}.mt28{margin-top:28px}
.divider{height:1px;background:var(--line-2);}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;
  border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.01em;
  transition:transform .12s ease,opacity .12s ease;}
.btn:active{transform:scale(.972);opacity:.92;}
.btn.accent{background:var(--accent);}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink);}
.btn.full{width:100%;}
.btn.sm{height:40px;font-size:14px;padding:0 16px;}
.btn[disabled]{opacity:.4;}

.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:520;
  transition:transform .12s ease;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:580;}
.chip.wrap{flex-wrap:wrap;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}

.quick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:14px 6px;transition:transform .12s ease,background .12s ease;}
.quick:active{transform:scale(.955);background:var(--surface-2);}
.quick span{font-size:12.5px;font-weight:560;letter-spacing:-.01em;}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}

.tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);
  padding:9px 6px calc(env(safe-area-inset-bottom,0px) + 9px);
  background:rgba(245,243,238,.86);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--line-2);z-index:40;}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;color:var(--muted);
  transition:color .15s ease;}
.tab.on{color:var(--ink);}
.tab em{font-size:10.5px;font-style:normal;font-weight:560;letter-spacing:-.005em;}

/* overlays */
.overlay{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  animation:slideIn .32s cubic-bezier(.32,.72,0,1);}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.navbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;}
.navbar .t{font-size:16px;font-weight:620;letter-spacing:-.015em;flex:1;text-align:center;}
.iconbtn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line-2);flex:none;}

.scrim{position:absolute;inset:0;z-index:70;background:rgba(23,24,26,.32);
  display:flex;align-items:flex-end;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
  max-height:88%;overflow-y:auto;animation:up .34s cubic-bezier(.32,.72,0,1);}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(23,24,26,.16);margin:0 auto 14px;}

.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;font-size:15px;resize:none;}
.field::placeholder{color:var(--muted);}

.toast{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:90;
  background:var(--ink);color:#fff;border-radius:16px;padding:13px 16px;font-size:14px;font-weight:540;
  display:flex;align-items:center;gap:9px;animation:up .26s cubic-bezier(.32,.72,0,1);}

.bar-track{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .6s cubic-bezier(.32,.72,0,1);}

.plan{display:flex;align-items:center;gap:13px;padding:14px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-md);width:100%;text-align:left;
  transition:transform .12s ease;}
.plan:active{transform:scale(.985);}
.tickbox{width:24px;height:24px;border-radius:999px;border:1.6px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;transition:all .18s ease;}
.tickbox.on{background:var(--accent);border-color:var(--accent);color:#fff;}

.insight{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px;}
.insight .tag{font-size:11px;font-weight:640;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}

.photo{width:100%;border-radius:var(--r-md);overflow:hidden;display:block;background:var(--surface-2);}
.timer{font-size:62px;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1;}

.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,11,10,.88) 0%,rgba(10,11,10,.3) 42%,rgba(10,11,10,.08) 100%);}

.fade-in{animation:fi .45s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .suki-root *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:0;height:0;}
